<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="ctabg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" fill="url(#ctabg)"/>
  
  <!-- 抽象圆环 -->
  <circle cx="700" cy="40" r="120" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.25"/>
  <circle cx="700" cy="40" r="90" fill="none" stroke="#60a5fa" stroke-width="1" opacity="0.15"/>
  <circle cx="80" cy="260" r="100" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.2"/>
  
  <!-- 小点阵 -->
  <g fill="white" opacity="0.10">
    <circle cx="150" cy="60" r="3"/>
    <circle cx="180" cy="90" r="3"/>
    <circle cx="140" cy="120" r="3"/>
    <circle cx="210" cy="70" r="3"/>
    <circle cx="620" cy="220" r="3"/>
    <circle cx="650" cy="190" r="3"/>
    <circle cx="590" cy="250" r="3"/>
  </g>
  
  <!-- 左侧指示图标组 -->
  <g transform="translate(0,0)">
    <rect x="100" y="70" width="14" height="14" rx="3" fill="#60a5fa"/>
    <rect x="122" y="84" width="14" height="14" rx="3" fill="#93c5fd"/>
    <rect x="100" y="98" width="14" height="14" rx="3" fill="#3b82f6"/>
    <rect x="122" y="112" width="14" height="14" rx="3" fill="#bfdbfe"/>
  </g>
  
  <!-- 右侧建筑竖线 -->
  <g opacity="0.3">
    <rect x="720" y="80" width="6" height="150" fill="white"/>
    <rect x="735" y="60" width="6" height="170" fill="white"/>
    <rect x="750" y="100" width="6" height="130" fill="white"/>
    <rect x="765" y="70" width="6" height="160" fill="white"/>
  </g>
</svg>