<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480">
  <defs>
    <linearGradient id="bgb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bgb)"/>
  
  <!-- 主界面卡片 -->
  <rect x="120" y="80" width="420" height="280" rx="16" fill="white" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- 卡片窗口点 -->
  <circle cx="150" cy="112" r="6" fill="#f87171"/>
  <circle cx="172" cy="112" r="6" fill="#fbbf24"/>
  <circle cx="194" cy="112" r="6" fill="#34d399"/>
  
  <!-- 搜索框 -->
  <rect x="150" y="138" width="360" height="44" rx="10" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="172" cy="160" r="7" stroke="#94a3b8" stroke-width="2" fill="none"/>
  <line x1="178" y1="166" x2="186" y2="174" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 结果行 -->
  <g>
    <rect x="150" y="200" width="360" height="36" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="166" y="212" width="180" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="460" y="212" width="34" height="10" rx="5" fill="#a5b4fc"/>
    
    <rect x="150" y="248" width="360" height="36" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="166" y="260" width="210" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="450" y="260" width="44" height="10" rx="5" fill="#86efac"/>
    
    <rect x="150" y="296" width="360" height="36" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="166" y="308" width="150" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="470" y="308" width="24" height="10" rx="5" fill="#fca5a5"/>
  </g>

  <!-- 侧边卡片 -->
  <rect x="580" y="150" width="170" height="180" rx="14" fill="white" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="610" y="180" width="110" height="14" rx="7" fill="#2563eb"/>
  <rect x="610" y="212" width="90" height="10" rx="5" fill="#bae6fd"/>
  <rect x="610" y="238" width="100" height="10" rx="5" fill="#dbeafe"/>
  <rect x="610" y="264" width="70" height="10" rx="5" fill="#e0e7ff"/>
  
  <rect x="560" y="280" width="40" height="40" rx="10" fill="#3b82f6"/>
  <path d="M575 300 L580 305 L590 290" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- 装饰圆 -->
  <circle cx="90" cy="380" r="30" fill="#3b82f6" opacity="0.08"/>
  <circle cx="720" cy="60" r="24" fill="#6366f1" opacity="0.08"/>
</svg>