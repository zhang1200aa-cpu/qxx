<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="35%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="grid-line" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <!-- 背景渐变 -->
  <rect width="1200" height="400" fill="url(#hero-bg)"/>
  
  <!-- 网格线 -->
  <g stroke="url(#grid-line)" stroke-width="1" fill="none">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- 抽象伦敦天际线剪影 -->
  <g fill="#2563eb" opacity="0.12">
    <rect x="850" y="180" width="34" height="140"/>
    <rect x="892" y="140" width="28" height="180"/>
    <rect x="928" y="200" width="30" height="120"/>
    <rect x="966" y="160" width="24" height="160"/>
    <rect x="998" y="210" width="32" height="110"/>
    <rect x="1040" y="120" width="18" height="200"/>
    <rect x="1066" y="175" width="26" height="145"/>
  </g>

  <!-- 大圆 + 小圆装饰 -->
  <circle cx="1050" cy="70" r="120" fill="#3b82f6" opacity="0.06"/>
  <circle cx="1000" cy="320" r="80" fill="#6366f1" opacity="0.05"/>
  <circle cx="1080" cy="330" r="50" fill="#60a5fa" opacity="0.04"/>

  <!-- 浮动数据卡抽象 -->
  <g opacity="0.35">
    <rect x="130" y="60" width="100" height="60" rx="8" fill="white" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="145" y="78" width="70" height="6" rx="3" fill="#93c5fd"/>
    <rect x="145" y="92" width="45" height="6" rx="3" fill="#dbeafe"/>
    <rect x="1350" y="250" width="100" height="60" rx="8" fill="white" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="1365" y="268" width="70" height="6" rx="3" fill="#93c5fd"/>
    <rect x="1365" y="282" width="45" height="6" rx="3" fill="#dbeafe"/>
  </g>

  <!-- 末端亮点 -->
  <ellipse cx="600" cy="400" rx="700" ry="60" fill="#3b82f6" opacity="0.03"/>
  <ellipse cx="300" cy="350" rx="350" ry="80" fill="#6366f1" opacity="0.03"/>
</svg>