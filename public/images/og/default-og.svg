<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- 网格图案 -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1.5">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
  </g>

  <!-- 装饰圆形 -->
  <circle cx="1080" cy="80" r="160" fill="rgba(255,255,255,0.05)"/>
  <circle cx="120" cy="560" r="120" fill="rgba(255,255,255,0.04)"/>

  <!-- 建筑条形 (玻璃摩根风格) -->
  <g opacity="0.18">
    <rect x="850" y="160" width="28" height="300" rx="4" fill="white"/>
    <rect x="895" y="120" width="20" height="340" rx="4" fill="white"/>
    <rect x="930" y="190" width="26" height="270" rx="4" fill="white"/>
    <rect x="972" y="100" width="16" height="360" rx="4" fill="white"/>
    <rect x="1005" y="150" width="22" height="310" rx="4" fill="white"/>
  </g>

  <!-- 品牌标记 -->
  <rect x="70" y="70" width="64" height="64" rx="16" fill="#ffffff" fill-opacity="0.15"/>
  <rect x="78" y="78" width="48" height="48" rx="12" fill="white"/>
  <path d="M92 92 L92 112" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <path d="M100 84 L100 120" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <path d="M108 92 L108 112" stroke="#2563eb" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- 标题 -->
  <text x="70" y="240" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="800" fill="white">qxx.uk</text>
  <text x="70" y="300" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="600" fill="#bfdbfe">UK Company &amp; Tax Intelligence</text>
  
  <!-- 特征行 -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="500" fill="rgba(255,255,255,0.85)">
    <rect x="70" y="340" width="10" height="10" rx="3" fill="#60a5fa"/>
    <text x="95" y="350">Companies House lookup</text>
    <rect x="70" y="380" width="10" height="10" rx="3" fill="#60a5fa"/>
    <text x="95" y="390">HMRC VAT verification</text>
    <rect x="70" y="420" width="10" height="10" rx="3" fill="#60a5fa"/>
    <text x="95" y="430">UK postcode data — Free · No sign-up</text>
  </g>

  <!-- 底部 URL -->
  <text x="70" y="570" font-family="'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="white" opacity="0.9">https://qxx.uk</text>
</svg>